name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR shares one group per branch, so a new push cancels its older run. Every
# push to main gets a group of its own: GitHub keeps only one pending run per
# group and cancels the rest, even without cancel-in-progress, and publish.yml
# needs a successful CI run on the exact commit being tagged.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install -g opencode-ai@1.18.32
      # Pinned DeepSeek Harness for the dsh-smoke tripwire below
      # (and e2e's dsh wiring matrix); check-dist keeps the pin
      # in step with the CLI's install hint.
      - run: npm install -g --ignore-scripts @deepseek-ai/dsh@0.2.0-rc.2
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
      # No scripts field in the package (npm view @github/copilot@1.0.89
      # scripts is empty; bin is a plain node npm-loader.js), so
      # --ignore-scripts is a no-op here — it matches the pi pin's
      # discipline and keeps a future postinstall from running CI-side.
      - run: npm install -g --ignore-scripts @github/copilot@1.0.89
      # Pinned omp for the omp-smoke tripwire below: the v18.4.4 release
      # asset, checked against its published sha256 before it reaches PATH.
      - run: |
          mkdir -p "$RUNNER_TEMP/omp"
          curl -fsSLo "$RUNNER_TEMP/omp/omp" https://github.com/can1357/oh-my-pi/releases/download/v18.4.4/omp-linux-x64
          echo "24c830fceb0bd6884bf5bf2c7a2b7407bc23fafe655e924c695ef9be308e46f3  $RUNNER_TEMP/omp/omp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/omp/omp"
          echo "$RUNNER_TEMP/omp" >> "$GITHUB_PATH"
      - run: npm run lint
      # Builds dist/ (reused by every later step), then runs the `npm test`
      # suite under the coverage floor set in package.json.
      - run: npm run test:coverage
        env:
          AIAND_API_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.AIAND_API_KEY || '' }}
      # The live e2e (test/e2e-live.test.mjs) runs inside `npm test` above
      # with the same key (pushes and same-repo PRs) and skips itself without
      # key+binary (fork PRs stay green). A fork push whose key has no credits also skips; official
      # main still fails on that. No continue-on-error step.
      - run: node scripts/e2e.mjs
      # Real pinned DeepSeek Harness accepting the generated
      # $DSH_HOME rows and a headless round-trip: the schema-drift
      # tripwire for cordis.patch.yml.
      - run: node scripts/dsh-smoke.mjs
      # Real pinned Pi validating the generated config and a headless
      # --print round-trip against the loopback double (no real gateway,
      # no key): the schema-drift tripwire for models.json.
      - run: node scripts/pi-smoke.mjs
      # Real pinned omp accepting the generated models.yml and a headless -p
      # round-trip: the schema-drift tripwire for omp's provider block.
      - run: node scripts/omp-smoke.mjs
      # Real pinned Copilot CLI accepting the generated providers.json and
      # a headless -p round-trip: the schema-drift tripwire for the BYOK
      # provider shape.
      - run: node scripts/copilot-smoke.mjs
      - run: node scripts/sbx-test.mjs --smoke dist/index.js
      - run: npm run check:dist
      - run: npm run check:public
  # Full live matrix against the real gateway: pasted-key login, whoami,
  # status, run, models, usage, orgs, config, logout, `opencode on/status/off`,
  # `restore --force`, `init`, and the `run-agent` launcher, all in a fresh
  # temp state dir. Needs the AIAND_API_KEY secret, so it runs on pushes to
  # main and on PRs from branches of this repository (fork PRs get no
  # secrets and skip). Spends a few cents of credit per run.
  live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # sbx-test plants its own stub agent binaries; the real opencode run is
      # test/e2e-live.test.mjs in the build job.
      - run: node scripts/sbx-test.mjs dist/index.js
        env:
          AIAND_API_KEY: ${{ secrets.AIAND_API_KEY }}
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Install into an isolated HOME from the checkout itself (no network
      # clone: AIAND_SOURCE points at actions/checkout's copy) and assert
      # the launcher reports this PR's package.json version.
      - run: |
          set -euo pipefail
          export ISOLATED_HOME="$RUNNER_TEMP/aiand-install-home"
          mkdir -p "$ISOLATED_HOME"
          HOME="$ISOLATED_HOME" AIAND_SOURCE="$GITHUB_WORKSPACE" AIAND_NO_MODIFY_PATH=1 bash "$GITHUB_WORKSPACE/install.sh"
          expected="$(node -p "require('./package.json').version")"
          actual="$(HOME="$ISOLATED_HOME" "$ISOLATED_HOME/.local/bin/aiand" --version)"
          test "$actual" = "$expected" || { echo "aiand --version '$actual' != package.json '$expected'"; exit 1; }
          for rc in "$ISOLATED_HOME/.bashrc" "$ISOLATED_HOME/.zshrc"; do
            # install.sh writes the expanded path, so match on that.
            if [ -f "$rc" ] && grep -qF "$ISOLATED_HOME/.local/bin" "$rc"; then
              echo "unexpected PATH export in $rc with AIAND_NO_MODIFY_PATH=1"
              exit 1
            fi
          done
      # Isolated-HOME installer behavior cases (allowlist, stage-fail, NO_COLOR, pwsh).
      - run: node scripts/install-behavior.mjs
  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Local-checkout path ($PSScriptRoot is the checkout, no GitHub clone).
      # AIAND_NO_MODIFY_PATH=1 keeps CI off the runner's real HKCU\Environment.
      - run: |
          $iso = Join-Path $env:RUNNER_TEMP 'aiand-install-home'
          New-Item -ItemType Directory -Path $iso | Out-Null
          $env:USERPROFILE = $iso
          $env:HOME = $iso
          $env:AIAND_NO_MODIFY_PATH = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/install.ps1"
          $expected = node -p "require('./package.json').version"
          $cmd = Join-Path $iso '.local\bin\aiand.cmd'
          $actual = (& $cmd --version | Out-String).Trim()
          if ($actual -ne $expected) { throw "aiand --version '$actual' != '$expected'" }
          $shim = Join-Path $iso '.local\bin\aiand'
          if (-not (Test-Path $shim)) { throw "Git Bash shim missing: $shim" }
          $bash = $null
          foreach ($p in @((Join-Path $env:ProgramFiles 'Git\bin\bash.exe'), $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'Git\bin\bash.exe' }))) {
            if ($p -and (Test-Path -LiteralPath $p)) { $bash = $p; break }
          }
          if (-not $bash) { throw "Git Bash is required to verify the Git Bash shim" }
          $actualShim = (& $bash $shim --version | Out-String).Trim()
          if ($actualShim -ne $expected) { throw "Git Bash shim --version '$actualShim' != '$expected'" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/install.ps1" uninstall --force
          if (Test-Path $cmd) { throw "uninstall left $cmd" }
          if (Test-Path $shim) { throw "uninstall left $shim" }
        shell: powershell
      # install.ps1 above built dist/ in this checkout (local-checkout path).
      # e2e.mjs runs the adapter matrix plus its win32 install.ps1 uninstall
      # cases, which no other job exercises.
      - run: node scripts/e2e.mjs
      # Real npm-installed OpenCode and Pi (a .cmd shim on Windows) launched
      # through `aiand run-agent`, against the live gateway. Needs the key, so
      # same events as the live job. This is also the Windows install
      # tripwire for the Pi pin — check-dist keeps the version in step.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm install -g opencode-ai@1.18.32
      # check-dist keeps the pin in step with the CLI's
      # install hint; the gated run-agent dsh check below
      # needs the same-repo key.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm install -g --ignore-scripts @deepseek-ai/dsh@0.2.0-rc.2
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
      # check-dist keeps the pin in step with the CLI's install hint; the
      # gated run-agent copilot smoke below needs the same-repo key.
      # No scripts field in the package (npm view @github/copilot@1.0.89
      # scripts is empty; bin is a plain node npm-loader.js), so
      # --ignore-scripts is a no-op here — it matches the pi pin's
      # discipline and keeps a future postinstall from running CI-side.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm install -g --ignore-scripts @github/copilot@1.0.89
      # Windows downloads the same pinned release asset as the Linux job
      # (check-dist keeps the two in step). RUNNER_TEMP is not on PATH, so
      # expose the dir via GITHUB_PATH. Gated with the run-agent check
      # below so fork PRs skip the download.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'omp'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $exe = Join-Path $dir 'omp.exe'
          Invoke-WebRequest -Uri https://github.com/can1357/oh-my-pi/releases/download/v18.4.4/omp-windows-x64.exe -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne '5644e5d7c7cddd851d79999dbc3b98363817178b33426b355a20fdcad41a3f54') { throw 'omp-windows-x64.exe sha256 mismatch' }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'aiand-run-agent'
          New-Item -ItemType Directory -Path $state | Out-Null
          $env:AIAND_HOME = $state
          $env:AIAND_CONFIG_DIR = Join-Path $state 'cfg'
          $out = (node dist/index.js run-agent opencode -- --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "run-agent opencode exited $LASTEXITCODE" }
          if ($out -notmatch '\d+\.\d+\.\d+') { throw "unexpected opencode --version output: $out" }
          Write-Output "opencode via run-agent: $out"
          $out = (node dist/index.js run-agent dsh -- --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "run-agent dsh exited $LASTEXITCODE" }
          if ($out -notmatch '\d+\.\d+\.\d+') { throw "unexpected dsh --version output: $out" }
          Write-Output "dsh via run-agent: $out"
          $out = (node dist/index.js run-agent pi -- --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "run-agent pi exited $LASTEXITCODE" }
          if ($out -notmatch '\d+\.\d+\.\d+') { throw "unexpected pi --version output: $out" }
          Write-Output "pi via run-agent: $out"
          $out = (node dist/index.js run-agent omp -- --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "run-agent omp exited $LASTEXITCODE" }
          if ($out -notmatch '\d+\.\d+\.\d+') { throw "unexpected omp --version output: $out" }
          Write-Output "omp via run-agent: $out"
          $out = (node dist/index.js run-agent copilot -- --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "run-agent copilot exited $LASTEXITCODE" }
          if ($out -notmatch '\d+\.\d+\.\d+') { throw "unexpected copilot --version output: $out" }
          Write-Output "copilot via run-agent: $out"
        env:
          AIAND_API_KEY: ${{ secrets.AIAND_API_KEY }}
