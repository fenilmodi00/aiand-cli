name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g opencode-ai@1.18.30
      - run: npm run lint
      - run: npm test
        env:
          AIAND_API_KEY: ${{ github.event_name == 'push' && secrets.AIAND_API_KEY || '' }}
      - run: node --test test/e2e-live.test.mjs
        if: success() || failure()
        continue-on-error: true
        env:
          AIAND_API_KEY: ${{ github.event_name == 'push' && secrets.AIAND_API_KEY || '' }}
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:public
